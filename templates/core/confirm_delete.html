{% extends 'base.html' %}

{% block title %}Excluir {{ tipo }} - Sistema de Folha de Pagamento{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center">
        <a href="{% url voltar_url %}" class="mr-4 text-gray-500 hover:text-gray-700">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <h1 class="text-2xl font-bold text-gray-900">Excluir {{ tipo }}</h1>
    </div>

    <div class="bg-white shadow-sm rounded-xl overflow-hidden p-6 border border-gray-100">
        <div class="mb-6 bg-red-50 border border-red-200 rounded-lg p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i data-lucide="alert-triangle" class="w-6 h-6 text-red-600"></i>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">Atenção!</h3>
                    <div class="mt-1 text-sm text-red-700">
                        <p>Você está prestes a excluir o registro: <strong class="font-bold text-red-900">{{ objeto }}</strong>.</p>
                        <p class="mt-1">Esta ação <strong>não poderá ser desfeita</strong>.</p>
                    </div>
                </div>
            </div>
        </div>

        <form method="post" class="flex justify-end space-x-3">
            {% csrf_token %}
            <a href="{% url voltar_url %}" class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                Cancelar
            </a>
            <button type="submit" class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 shadow-sm">
                Confirmar Exclusão
            </button>
        </form>
    </div>
</div>
{% endblock %}
